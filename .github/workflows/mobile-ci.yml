name: Mobile CI

on:
  push:
    branches:
      - feature/dynamic-home-background
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common:
    name: Compile shared Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local properties
        run: touch local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile common Kotlin metadata
        run: ./gradlew compileCommonMainKotlinMetadata --stacktrace

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Full debug APK
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Locate APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Compile iOS simulator target
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create runtime configuration
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          test -n "$NUVIO_SUPABASE_URL" || {
            echo "NUVIO_SUPABASE_URL is missing"
            exit 1
          }

          test -n "$NUVIO_SUPABASE_ANON_KEY" || {
            echo "NUVIO_SUPABASE_ANON_KEY is missing"
            exit 1
          }

          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile common Kotlin metadata
        run: ./gradlew compileCommonMainKotlinMetadata --stacktrace

      - name: Compile iOS simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

  ios-app:
    name: Build unsigned iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch MPVKit dependency
        run: |
          rm -rf MPVKit
          git clone --depth 1 \
            https://github.com/tapframe/MPVNuvio.git \
            MPVKit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create runtime configuration
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          test -n "$NUVIO_SUPABASE_URL" || {
            echo "NUVIO_SUPABASE_URL is missing"
            exit 1
          }

          test -n "$NUVIO_SUPABASE_ANON_KEY" || {
            echo "NUVIO_SUPABASE_ANON_KEY is missing"
            exit 1
          }

          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Xcode configuration
        run: |
          xcodebuild -version
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -list

      - name: Build unsigned iOS simulator app
        run: |
          set -o pipefail

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NuvioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate iOS app
        run: |
          find "$RUNNER_TEMP/NuvioDerivedData" \
            -type d \
            -path '*Debug-iphonesimulator/*.app' \
            -print

      - name: Package simulator app
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/NuvioDerivedData" \
            -type d \
            -path '*Debug-iphonesimulator/Nuvio.app' \
            | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app was not found"
            exit 1
          fi

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/Nuvio-iOS-Simulator.zip"

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-ios-simulator-app
          path: ${{ runner.temp }}/Nuvio-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  ios-device-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch MPVKit dependency
        run: |
          rm -rf MPVKit
          git clone --depth 1 \
            https://github.com/tapframe/MPVNuvio.git \
            MPVKit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local properties
        run: touch local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Xcode configuration
        run: |
          xcodebuild -version
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -list

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NuvioDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate device app
        run: |
          find "$RUNNER_TEMP/NuvioDeviceDerivedData" \
            -type d \
            -path '*Debug-iphoneos/Nuvio.app' \
            -print

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/NuvioDeviceDerivedData" \
            -type d \
            -path '*Debug-iphoneos/Nuvio.app' \
            | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app device build was not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/UnsignedIPA/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/UnsignedIPA/Payload/"

          cd "$RUNNER_TEMP/UnsignedIPA"
          zip -qry "$RUNNER_TEMP/Nuvio-unsigned.ipa" Payload

          ls -lh "$RUNNER_TEMP/Nuvio-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/Nuvio-unsigned.ipa" | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-unsigned-iphone-ipa
          path: ${{ runner.temp }}/Nuvio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
